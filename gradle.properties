org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
kotlin.incremental=true

# ⚠️ 本地环境专用，**新机器上请先注释掉或删掉这一行**。
#
# Google 发布的 Linux aapt2 只有 x86_64 版本；原始开发机是 aarch64（Android 容器），
# 所以用 qemu-x86_64-static + x86_64 glibc sysroot 把官方二进制包了一层，
# 放在 /opt/dream/bin/aapt2，并通过这个属性挂上去。
#
# 如果你的机器是 x86_64（绝大多数 PC / CI），**不需要这行** —— 留着反而会因为
# 找不到 /opt/dream/bin/aapt2 而构建失败。
#
# android.aapt2FromMavenOverride=/opt/dream/bin/aapt2
