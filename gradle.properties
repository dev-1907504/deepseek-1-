org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
kotlin.incremental=true

# Google 发布的 Linux aapt2 只有 x86_64；本机是 aarch64。
# /opt/dream/bin/aapt2 是包装脚本，用 qemu-x86_64-static + x86_64 glibc sysroot 运行官方二进制。
android.aapt2FromMavenOverride=/opt/dream/bin/aapt2
